services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contratas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-contratas}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contratas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No se expone el puerto 5432 aquí (ver docker-compose.override.yml,
    # que no va en git, para el caso puntual del VPS): así el compose
    # compartido no choca con un Postgres nativo que ya use ese puerto en
    # tu máquina local.
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-contratas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-contratas}?schema=public
    ports:
      - "3000:3000"

  # Worker de WhatsApp automático (docs/whatsapp.md). Va en un perfil
  # aparte a propósito: el deploy normal (`docker compose up -d`) NO lo
  # levanta ni lo reinicia — las reconexiones frecuentes son señal de riesgo
  # para el número. Se arranca/actualiza a mano:
  #   sudo docker compose --profile whatsapp build whatsapp
  #   sudo docker compose --profile whatsapp up -d whatsapp
  whatsapp:
    profiles: ["whatsapp"]
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-contratas}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-contratas}?schema=public
    # WHATSAPP_SESSION_KEY se lee de .env (no se interpola aquí: un `:?` haría
    # fallar también el deploy de la app mientras no exista). El worker se
    # niega a arrancar sin ella.
    # ~150–200 MB por sesión, máximo 6 números.
    mem_limit: 1536m
    stop_grace_period: 20s

volumes:
  db_data:
